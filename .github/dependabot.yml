version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
      day: 7
      time: "00:05"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    assignees:
      - Sven-83
    versioning-strategy: increase
    ignore:
      # TypeScript 7 ships without a compiler API; typescript-eslint (via @iobroker/eslint-config)
      # and ts-node (mocha tests) cannot run on it yet. Re-evaluate once typescript-eslint supports TS 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
      day: 7
      time: "00:05"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    assignees:
      - Sven-83
